spring:
  application:
    name: vwallet
  datasource:
    url: jdbc:mysql://localhost:3306/vwallet?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: vwallet_user
    password: vwallet_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 5000
    consumer:
      group-id: vwallet-notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  sql:
    init:
      mode: always

vwallet:
  jwt:
    secret: "${JWT_SECRET:dGhpc19pc19hX3Zlcnlfc2VjdXJlXzI1Nl9iaXRfc2VjcmV0X2tleV9mb3JfdndhbGxldF9kZXYh}"
    access-token-expiration-seconds: 900
    refresh-token-expiration-seconds: 604800
    refresh-grace-period-seconds: 30
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}"
  withdraw:
    min-amount: 10000
    max-amount: 50000000
  qr:
    secret: "${QR_SECRET:dGhpc19pc19hX3Zlcnlfc2VjdXJlXzI1Nl9iaXRfcXJfZGV2X3NlY3JldF9rZXkh}"
    dynamic-ttl-seconds: 900
    min-amount: 1000
    max-amount: 50000000
  lookup:
    rate-limit-per-minute: 30
  sse:
    max-emitters-per-user: 5
  kafka:
    topics:
      transaction-completed: "vwallet.transaction.completed"


